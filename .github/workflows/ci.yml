# Lint, build and test on every pull request and every push to main. Linux only, no GPU and
# no container engine: the tests marked `gpu` and `sandbox` skip here, as they do on any
# machine without LECTERN_TEST_* set (pyproject.toml).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; every build of main runs to the end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned by commit, the tag beside each for reading.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.12.23"  # UV_VERSION in packaging/pins.sh
          enable-cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: |
          uv sync --frozen
          npm --prefix web ci

      - name: Lint
        run: |
          uv run ruff check .
          npm --prefix web run lint

      # tsc -b runs here, which catches type errors eslint and vitest don't; the UI it builds
      # also lets the wheel test run instead of skipping.
      - name: Build the web UI
        run: npm --prefix web run build

      - name: Test
        run: |
          uv run pytest
          npm --prefix web test

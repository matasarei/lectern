# nginx in front of Lectern on the same machine (Lectern listens on 127.0.0.1:8765 only).
# Copy to /etc/nginx/conf.d/lectern.conf, set server_name, then:
#   sudo nginx -t && sudo systemctl reload nginx
# Put the same address in /etc/lectern/lectern.env:  LECTERN_PUBLIC_URL=http://lectern.lan
#
# Fedora/RHEL (SELinux): let nginx connect to Lectern's port, and only that one, once:
#   sudo semanage port -a -t http_port_t -p tcp 8765
# (setsebool -P httpd_can_network_connect 1 works too, but lets nginx connect to any port.)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name lectern.lan;  # the name or IP people use on your network

    # Scans and documents are uploaded through here.
    client_max_body_size 1g;

    location / {
        proxy_pass http://127.0.0.1:8765;
        # Lectern accepts only the Host and Origin of LECTERN_PUBLIC_URL: pass the Host on.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets (the chat).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Event streams (replies, downloads, OCR progress) must reach the page as they come.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}

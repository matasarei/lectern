[project]
name = "lectern-ai"
version = "0.1.0.dev0"
description = "A local, modular AI workbench: chat and OCR sessions on your own hardware."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "typer>=0.15",
    "platformdirs>=4.3",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psutil>=6.1",
    "nvidia-ml-py>=12.560",
    "pyyaml>=6.0",
    "httpx2>=2.13",
]

[project.scripts]
lectern = "lectern.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lectern"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
filterwarnings = ["error"]

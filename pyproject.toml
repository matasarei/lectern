[project]
name = "lectern-ai"
version = "0.1.0.dev0"
description = "A local, modular AI workbench: chat and OCR sessions on your own hardware."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "typer>=0.15",
    "platformdirs>=4.3",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psutil>=6.1",
    "nvidia-ml-py>=12.560",
    "pyyaml>=6.0",
    "httpx2>=2.13",
    "gguf>=0.17",
    "pypdfium2>=5.13",
    "python-docx>=1.2",
]

[project.optional-dependencies]
# Apple Silicon only, and off by default in the app (the MLX servers can't be keyed yet).
mlx = [
    "mlx-lm>=0.31; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-vlm>=0.7; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
lectern = "lectern.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lectern"]
# The built UI is git-ignored, but it must ship in the wheel.
artifacts = ["src/lectern/web_dist/**"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
filterwarnings = ["error"]
markers = [
    "gpu: starts a real llama-server; set LECTERN_TEST_LLAMA_SERVER and LECTERN_TEST_GGUF",
]

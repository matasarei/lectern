[project]
name = "lectern-ai"
version = "0.1.0.dev0"
description = "A local, modular AI workbench: chat and OCR sessions on your own hardware."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "typer>=0.15",
    "platformdirs>=4.3",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psutil>=6.1",
    "nvidia-ml-py>=12.560",
    "pyyaml>=6.0",
    "httpx2>=2.13",
    "gguf>=0.17",
    "pypdfium2>=5.13",
    "python-docx>=1.2",
    "pillow>=11",
    "odfdo>=3.26,<4",
    "argon2-cffi>=25.1",
    "ddgs>=9.16,<9.17",
    "primp>=2.0,<3",
]

[project.optional-dependencies]
# Apple Silicon only. `mlx` is MLX's text server, which the Mac installer adds and Models &
# memory can switch on. It is pinned to the versions lectern.runners.mlx_text_server was read
# against: that module puts a key in front of the server by changing its request handler, so
# a new mlx-lm is read before this range is widened. `mlx-vision` is the vision server, for
# OCR models on MLX; nothing installs it yet.
mlx = ["mlx-lm>=0.32,<0.33; sys_platform == 'darwin' and platform_machine == 'arm64'"]
mlx-vision = ["mlx-vlm>=0.7; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
lectern = "lectern.cli:app"

# Modules plug in here. The built-in ones are listed like any other would be.
[project.entry-points."lectern.modules"]
sandbox = "lectern.modules.sandbox:module"
ocr = "lectern.modules.ocr:module"
export-md = "lectern.modules.export_md:module"
export-docx = "lectern.modules.export_docx:module"
export-odt = "lectern.modules.export_odt:module"
web = "lectern.modules.web:module"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lectern"]
# The built UI is git-ignored, but it must ship in the wheel.
artifacts = ["src/lectern/web_dist/**"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
filterwarnings = ["error"]
markers = [
    "gpu: starts a real llama-server; set LECTERN_TEST_LLAMA_SERVER and LECTERN_TEST_GGUF, or LECTERN_TEST_OCR_HOME",
    "sandbox: runs a real container; set LECTERN_TEST_SANDBOX_IMAGE to a Python image",
]

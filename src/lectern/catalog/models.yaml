      prompt_guide: >-
        The image model is Z-Image-Turbo. Write one detailed paragraph of plain English prose,
        50 to 120 words: the main subject first, then its appearance and what it is doing, the
        setting, the style or medium, the light, the colours and the mood. Be concrete; it
        follows long, specific descriptions well. Say what should be there, never what
        shouldn't. Put any words that must appear in the picture in quotes, with where they go
        and how they look. This model can't see reference pictures: when some are given,
        describe in the prompt everything that must be taken from them (the subject's looks,
        the style, the layout), as if for someone who has never seen them.

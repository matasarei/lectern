  # Image models, run by stable-diffusion.cpp (runners/sdcpp.py). Each is three pieces: the
  # diffusion model, the text encoder and the VAE, pinned from the HF API on 2026-11-07. The
  # same model on every tier; a bigger GPU gets the 8-bit build and larger pictures. The sizes
  # are starting values until they are measured on 4 GB and 8 GB machines
  # (docs/acceptance/image.md).
  - id: flux2-klein-4b
    title: FLUX.2 klein 4B
    quant: Q4_0
    roles: [image]
    format: sd
    repo: leejet/FLUX.2-klein-4B-GGUF
    revision: 3b1f5a9dc3abb32238b053aeb3d823c30afdacbd
    licence: Apache-2.0
    permissive: true
    defaults:
      image: [below_minimum, minimum]
    files:
      model:
        - {path: flux-2-klein-4b-Q4_0.gguf, size: 2460378560, sha256: d1023499ef3f2f82ff7c50e6778495195c1b6cc34835741778868428111f9ff4}
      text_encoder: {path: Qwen3-4B-Q4_K_M.gguf, size: 2497281312, sha256: f6f851777709861056efcdad3af01da38b31223a3ba26e61a4f8bf3a2195813a, repo: unsloth/Qwen3-4B-GGUF, revision: 22c9fc8a8c7700b76a1789366280a6a5a1ad1120}
      vae: {path: full_encoder_small_decoder.safetensors, size: 249519092, sha256: ea4273f02d1fafbf8e1d1c2cf6018ed8748652eb0bf34f2dd91171f16f15ab62, repo: black-forest-labs/FLUX.2-small-decoder, revision: a3efc24f613ef42d9428af62fdbd6f5fd8856c4a}
    image:
      steps: 4
      cfg: 1.0
      sampler: euler
      references: 4
      # Written from Black Forest Labs' FLUX.2 prompting guide (docs.bfl.ai/guides/prompting_guide_flux2).
      prompt_guide: >-
        The image model is FLUX.2 klein. Write one paragraph of plain English prose, 30 to 80
        words. Put the main subject first, then what it is doing, then the style, then the
        setting, the light and the colours: the words that come first count most. Name a
        medium or a camera when it helps (watercolour, oil painting, 35 mm photo, flat vector
        illustration). Say what should be there, never what shouldn't: this model ignores
        "no" and "without". Put any words that must appear in the picture in quotes, with where
        they go and how they look. When reference pictures are given, call them image 1,
        image 2 and so on, and say what to take from each: the subject, the style, the layout
        or the background, and what should change.
      sizes:
        below_minimum: {default: 512, max_pixels: 589824}  # 768 x 768
        minimum: {default: 768, max_pixels: 1048576}  # 1024 x 1024
        recommended: {default: 1024, max_pixels: 1572864}  # 1536 x 1024
        comfortable: {default: 1024, max_pixels: 2097152}  # about 2 MP

